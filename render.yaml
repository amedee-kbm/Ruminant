services:
  - type: web
    name: ruminant
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_KEY
        sync: false
    routes:
      # BrowserRouter: serve index.html for client-side routes
      - type: rewrite
        source: /*
        destination: /index.html
