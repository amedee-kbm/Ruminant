# Supabase pauses free-tier projects after ~7 days without activity.
# This runs a trivial query twice a week so the project stays awake.
name: Supabase keepalive

on:
  schedule:
    - cron: '0 9 * * 1,4' # Mondays and Thursdays, 09:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/chapters?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY"
